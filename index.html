<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TOMÁS ANDRADA - FOTOGRAFÍA DEPORTIVA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1 class="logo">
    <span id="typing"></span>
  </h1>
  <div id="quote-box">
    <span id="quote"></span>
  </div>
</header>

<!-- HERO -->
<section class="hero">
  <img src="foto1.jpg" alt="foto principal">
</section>

<!-- PORTFOLIO -->
<section class="portfolio">
  <div class="carousel">
    <div class="track">
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
      <img src="foto4.jpg">
      <img src="foto5.jpg">
      <img src="foto6.jpg">

      <!-- duplicadas para loop -->
      <img src="foto1.jpg">
      <img src="foto2.jpg">
      <img src="foto3.jpg">
      <img src="foto4.jpg">
      <img src="foto5.jpg">
      <img src="foto6.jpg">
    </div>
  </div>
</section>

<!-- OVERLAY -->
<div id="overlay">
  <img id="overlay-img">
</div>

<!-- REDES -->
<footer class="social">
  <a href="https://instagram.com/shotsbytoto" target="_blank">
    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg">
    <span>@shotsbytoto</span>
  </a>
</footer>

<!-- CURSOR -->
<div class="cursor"></div>

<script src="script.js"></script>
</body>
</html>
